# 「更多球」的访问转换表
#
# MobEffectInstance 的 duration / amplifier 是私有字段，而「熔融物烧伤」需要在
# MobEffectEvent.Added 里按目标的实时护甲与金属装备重算这两个值 ——
# 挂载那一刻是唯一能覆盖**所有**路径的时机（原版 /effect 命令、药水、命令方块、
# 其他模组的 addEffect 全都走这里，而模组自己的两个调用点只覆盖球命中与热辐射）。
public net.minecraft.world.effect.MobEffectInstance duration
public net.minecraft.world.effect.MobEffectInstance amplifier

# Display 的 setTransformation 是 private，而「敌对球」要给头顶那个球图标设缩放
# （作者指定：变小到与掉落物图标差不多大）。放开它一个即可 ——
# 位置用的 setPos 本来就是 Entity 的公开方法，不需要动。
public net.minecraft.world.entity.Display setTransformation(Lcom/mojang/math/Transformation;)V

# 同上 —— Display 的 setBillboardConstraints 也是 private。
# 不设它的话 billboard 默认是 FIXED（固定朝向），球图标从侧面看只剩一条边，
# 现象就是作者报的「环绕的贴图卡成侧面转不过来」。设成 CENTER 让它永远正对镜头。
public net.minecraft.world.entity.Display setBillboardConstraints(Lnet/minecraft/world/entity/Display$BillboardConstraints;)V

# LightningBolt 的 visualOnly 是**私有字段**，而且只有 setter（setVisualOnly）、
# 没有 getter —— 而【导电】需要在闪电加入世界的那一刻判断它是不是
# 「【引雷】自己召唤的视觉闪电」（那种必须劈在目标身上，不能被附近的铜球吸走，
# 否则铜球白吃一发雷还要扣 1 点耐久）。放开这一个字段即可。
public net.minecraft.world.entity.LightningBolt visualOnly