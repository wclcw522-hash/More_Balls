# 「更多球」的访问转换表
#
# MobEffectInstance 的 duration / amplifier 是私有字段，而「熔融物烧伤」需要在
# MobEffectEvent.Added 里按目标的实时护甲与金属装备重算这两个值 ——
# 挂载那一刻是唯一能覆盖**所有**路径的时机（原版 /effect 命令、药水、命令方块、
# 其他模组的 addEffect 全都走这里，而模组自己的两个调用点只覆盖球命中与热辐射）。
public net.minecraft.world.effect.MobEffectInstance duration
public net.minecraft.world.effect.MobEffectInstance amplifier