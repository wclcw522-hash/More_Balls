# ============================================================
#  07-NeoForge-26.2  -  Minecraft 26.2 / NeoForge version line
#
#  Mod: [More_Balls]  (display name carries CJK via \uXXXX below)
#  To upgrade this line: change mc_version and loader_version below,
#  then run `gradle build`. Code stays untouched.
#
#  NOTE: this file is intentionally ASCII-only. Gradle decodes .properties
#  as ISO-8859-1 and Windows PowerShell rewrites them as GBK, which burns
#  any raw CJK comment into mojibake. Edit it with an editor, never with
#  Get-Content/Set-Content.
# ============================================================

# ---------- Version assignment ----------
mc_version=26.2
loader=NeoForge
loader_version=26.2.0.88
# This is the javafml (FML language loader) range, written into mods.toml
# as loaderVersion. It is NOT the NeoForge version. Putting a NeoForge
# version here (e.g. [26.3.0,)) makes FML refuse to load the mod:
#   "needs language provider javafml:26.3.0 or above to load. We have found 12.0"
# FML 12 provides javafml major version 12; MDK and mainstream mods use [4,).
loader_version_range=[4,)

# ---------- Build toolchain ----------
# IMPORTANT: ASCII paths only. Gradle decodes .properties as ISO-8859-1, so a
# CJK path (E:\ds-yong) is read back as mojibake and every path lookup
# silently fails. Builds must therefore run through the ASCII mirror C:\mcbuild
# (a directory symlink pointing at this workspace).
use_ascii_mirror=true
mirror_root=C:/mcbuild
java_version=25
jdk_root=C:/mcbuild/.shared/tools/jdk

# Shared source root: single source of truth for code shared by all version lines
mirror_shared_subpath=.shared/shared-code

# ---------- Mappings (Parchment gives readable parameter names) ----------
# Set to false when the mapping for this MC version is unpublished, or when the
# network is unstable; official mappings are used instead.
use_parchment=false
parchment_minecraft=26.2
parchment_version=2024.11.17

# ---------- Mod metadata (expanded into mods.toml by processResources) ----------
# Keep this ASCII: the values are injected into mods.toml and read back by the
# game, so non-ASCII text here would reach the player as mojibake.
# Naming rule: display name is "[CJK name] English_Name", spaces become underscores.
mod_id=more_balls
# CJK display name uses \uXXXX escapes: Gradle decodes properties as ISO-8859-1,
# so raw CJK would already be mojibake before being injected into mods.toml.
# These escapes decode back to the real display name via the Properties spec.
mod_name=[\u66f4\u591a\u7403] More_Balls
# jar output name (file names may carry CJK and brackets; mod_id may not)
mod_jar_basename=[\u66f4\u591a\u7403] More_Balls
mod_license=All Rights Reserved
mod_version=0.3.3.54
mod_group_id=com.mcmodworkspace.moreballs
mod_authors=
mod_description=Adds more ball items and blocks to Minecraft

# ---------- Performance ----------
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8

# ---------- Compatibility dependency versions (JEI / AppleSkin) ----------
# The finished jar must coexist with the matching JEI and AppleSkin builds.
# jei_version must match mc_version; see _docs/05-compatibility.md.
jei_version=30.39.0.233
appleskin_version=3.0.10+mc26.2
# Compatibility verification jar cache (AppleSkin has no maven coordinates)
compat_jars=C:/mcbuild/.shared/compat-jars
